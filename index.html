<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1115">
  <title>FS Fit — Gestão simples para personal trainers</title>
  <meta name="description" content="Cadastre alunos, publique treinos e acompanhe sua consultoria online com o FS Fit.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header"><nav class="nav-container"><a class="logo-nav" href="index.html"><strong>FS</strong><span>Fit</span></a></nav></header>
  <main class="container">
    <section class="hero">
      <div>
        <span class="hero-badge">PLATAFORMA PARA PERSONAL TRAINERS</span>
        <h1>Seus alunos, treinos e orientações em um só lugar.</h1>
        <p>Organize sua consultoria, atualize planos sem reenviar PDFs e entregue a cada aluno um portal individual pronto para celular.</p>
      </div>
      <div class="card auth-card">
        <div class="auth-logo"><strong>FS</strong><span>Fit</span></div>
        <h2 id="auth-title">Acesse sua conta</h2>
        <div id="auth-message" class="message"></div>
        <form id="auth-form">
          <div id="name-group" class="form-group hidden"><label for="full_name">Seu nome</label><input id="full_name" name="full_name" autocomplete="name"></div>
          <div class="form-group"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="form-group"><label for="password">Senha</label><input id="password" name="password" type="password" minlength="6" autocomplete="current-password" required></div>
          <div id="confirm-group" class="form-group hidden"><label for="confirm_password">Confirmar senha</label><input id="confirm_password" name="confirm_password" type="password" minlength="6"></div>
          <button id="auth-submit" class="btn btn-primary" type="submit" style="width:100%">Entrar</button>
        </form>
        <div class="auth-switch"><button id="auth-switch" type="button">Ainda não tem cadastro? Criar conta</button></div>
      </div>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
