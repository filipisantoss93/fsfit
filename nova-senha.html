<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1115">
  <title>Nova senha — FS Fit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="main-header"><nav class="nav-container"><a class="logo-nav" href="index.html"><strong>FS</strong><span>Fit</span></a></nav></header>
  <main class="container">
    <section class="hero" style="grid-template-columns:1fr;min-height:calc(100vh - 140px)">
      <div class="card auth-card" style="justify-self:center;width:min(470px,100%)">
        <div class="auth-logo"><strong>FS</strong><span>Fit</span></div>
        <h2>Crie sua nova senha</h2>
        <div id="password-message" class="message"></div>
        <form id="password-form">
          <div class="form-group">
            <label for="new-password">Nova senha</label>
            <input id="new-password" name="password" type="password" minlength="6" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirm-new-password">Confirmar nova senha</label>
            <input id="confirm-new-password" name="confirm_password" type="password" minlength="6" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%">Salvar nova senha</button>
        </form>
        <div class="auth-switch"><a href="index.html">Voltar para o login</a></div>
      </div>
    </section>
  </main>
  <script type="module" src="js/nova-senha.js"></script>
</body>
</html>
