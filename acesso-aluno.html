<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Acesso do aluno — FS Fit</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/fsfit-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body class="student-page"><main class="student-shell"><header class="student-header"><div class="auth-logo"><strong>FS</strong><span>Fit</span></div><p>Acesso do aluno</p></header><section class="card"><div id="access-message" class="message"></div><div class="grid grid-2"><form id="login-form"><h2>Entrar</h2><div class="form-group"><label>WhatsApp</label><input name="telefone" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" placeholder="DDD + número" required></div><div class="form-group"><label>PIN de 4 números</label><input name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></div><button class="btn btn-primary" type="submit">Entrar no meu plano</button></form><form id="activation-form"><h2>Primeiro acesso</h2><div class="form-group"><label>WhatsApp</label><input name="telefone" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" required></div><div class="form-group"><label>Código de ativação</label><input name="codigo" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></div><div class="form-group"><label>Crie seu PIN</label><input name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required></div><button class="btn btn-secondary" type="submit">Ativar meu acesso</button></form></div></section></main><script type="module" src="js/acesso-aluno.js"></script></body></html>
