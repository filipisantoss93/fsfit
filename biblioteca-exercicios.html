<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <script src="/js/zoom-lock.js?v=20260718-zoom-lock5"></script>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f1115">
  <title>Biblioteca de exercícios — FS Fit</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/biblioteca-exercicios.css?v=20260716-clean1">
  <link rel="stylesheet" href="css/library-compact.css?v=20260720-action-bar2">
  <meta name="apple-mobile-web-app-title" content="FS Fit">
  <meta name="application-name" content="FS Fit">
  <link rel="icon" href="/assets/icons/01-web-favicon/favicon.ico?v=20260717-icons-global2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/01-web-favicon/favicon-32x32.png?v=20260717-icons-global2">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/01-web-favicon/apple-touch-icon.png?v=20260717-icons-global2">
</head>
<body>
  <div id="header-container"></div>
  <main class="container exercise-library-page">
    <section class="page-header">
      <div>
        <a class="btn btn-outline" href="alunos.html">← Voltar</a>
        <h1>Biblioteca de exercícios</h1>
        <p>Selecione uma categoria e gerencie os exercícios disponíveis.</p>
      </div>
      <div class="actions library-top-actions">
        <button id="open-category-modal" class="btn btn-outline" type="button">+ Categoria</button>
        <button id="open-library-modal" class="btn btn-primary" type="button">+ Exercício</button>
      </div>
    </section>
    <div id="library-message" class="message"></div>
    <section id="library-exercises-section" class="card library-list-card">
      <div class="library-list-heading">
        <div class="form-group library-search"><input id="exercise-search" type="search" placeholder="Buscar em todas as categorias" aria-label="Buscar exercício em todas as categorias"></div>
      </div>
      <div class="library-category-nav-wrap"><div id="library-category-nav" class="library-category-nav" aria-label="Categorias de exercícios"></div></div>
      <div id="active-category-actions" class="library-active-category-actions hidden"></div>
      <div id="exercise-library-list" class="exercise-library-list"><p>Carregando exercícios...</p></div>
    </section>
  </main>

  <div id="library-modal" class="library-modal" aria-hidden="true">
    <div class="library-modal-backdrop" data-close-library-modal></div>
    <section class="library-modal-card" role="dialog" aria-modal="true" aria-labelledby="library-form-title">
      <button class="library-modal-close" type="button" data-close-library-modal aria-label="Fechar">×</button>
      <div class="library-modal-kicker">EXERCÍCIO</div>
      <h2 id="library-form-title">Novo exercício</h2>
      <form id="exercise-library-form">
        <div class="form-group"><label>Nome *</label><input name="nome" maxlength="120" placeholder="Ex.: Supino reto" required></div>
        <div class="grid grid-2">
          <div class="form-group"><label>Categoria *</label><select name="categoria_id" required><option value="">Selecione uma categoria</option></select></div>
          <div class="form-group"><label>Tipo de prescrição *</label><select name="tipo_prescricao" required><option value="repeticoes">Repetições</option><option value="tempo">Tempo</option><option value="distancia">Distância</option></select></div>
          <div class="form-group"><label>Aparelho / equipamento</label><input name="equipamento" maxlength="120" placeholder="Banco e barra"></div>
        </div>
        <div class="form-group"><label>Instruções</label><textarea name="instrucoes" placeholder="Orientações de execução e segurança."></textarea></div>
        <div class="form-group"><label>Vídeo (YouTube ou Instagram)</label><input name="video_url" type="url" placeholder="https://youtube.com/... ou https://instagram.com/..."></div>
        <div class="library-modal-actions"><button id="library-submit" class="btn btn-primary" type="submit">Adicionar exercício</button><button id="cancel-library-edit" class="btn btn-neutral" type="button">Cancelar</button></div>
      </form>
    </section>
  </div>

  <div id="category-modal" class="library-modal" aria-hidden="true">
    <div class="library-modal-backdrop" data-close-category-modal></div>
    <section class="library-modal-card library-category-modal-card" role="dialog" aria-modal="true" aria-labelledby="category-form-title">
      <button class="library-modal-close" type="button" data-close-category-modal aria-label="Fechar">×</button>
      <div class="library-modal-kicker">CATEGORIA</div>
      <h2 id="category-form-title">Nova categoria</h2>
      <form id="category-form">
        <div class="form-group"><label>Nome da categoria *</label><input name="nome" maxlength="80" placeholder="Ex.: Abdômen" required></div>
        <div class="library-modal-actions"><button id="category-submit" class="btn btn-primary" type="submit">Criar categoria</button><button id="cancel-category-edit" class="btn btn-neutral" type="button">Cancelar</button></div>
      </form>
    </section>
  </div>
  <script src="js/library-row-click.js?v=20260720-row1"></script>
  <script type="module" src="js/biblioteca-exercicios.js?v=20260720-category-label1"></script>
  <script type="module" src="js/biblioteca-treinos.js?v=20260720-workout-builder2"></script>
  <script type="module" src="js/biblioteca-treinos-multiselect.js?v=20260721-picker-sheet2"></script>
  <script type="module" src="js/biblioteca-treinos-layout.js?v=20260720-action-bar1"></script>
</body>
</html>
