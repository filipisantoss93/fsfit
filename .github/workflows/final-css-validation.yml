name: Validação final do CSS

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**'
      - 'config/css-audit-budget.json'
      - 'scripts/final-css-validation.mjs'
      - '.github/workflows/final-css-validation.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'config/css-audit-budget.json'
      - 'scripts/final-css-validation.mjs'
      - '.github/workflows/final-css-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-css:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditoria estrutural existente
        run: node scripts/audit-css-pages.mjs

      - name: Validar orçamento
        run: node scripts/check-css-budget.mjs

      - name: Validar fechamento da consolidação
        run: node scripts/final-css-validation.mjs
