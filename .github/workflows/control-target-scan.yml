name: Controls and alignment review build

on:
  push:
    branches:
      - review/buttons-controls-alignment
    paths:
      - 'css/**/*.css'
      - 'scripts/audit-control-targets.mjs'
      - 'scripts/normalize-control-targets.mjs'
      - '.github/workflows/control-target-scan.yml'

permissions:
  contents: write

concurrency:
  group: controls-alignment-review
  cancel-in-progress: true

jobs:
  normalize-build-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/buttons-controls-alignment
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize control targets
        run: node scripts/normalize-control-targets.mjs

      - name: Compile TypeScript
        run: npm run build:typescript

      - name: Rebuild CSS bundles
        run: node scripts/build-css-bundles.mjs --write

      - name: Validate controls and runtime
        run: |
          npm run typecheck
          node scripts/audit-control-targets.mjs
          node scripts/audit-typography-legibility.mjs
          node scripts/audit-theme-contrast.mjs
          node scripts/build-css-bundles.mjs
          node scripts/audit-css-runtime.mjs
          node scripts/audit-css-pages.mjs
          node scripts/final-css-validation.mjs
          node scripts/audit-page-scripts.mjs
          node scripts/audit-global-runtime.mjs
          node scripts/audit-performance-accessibility.mjs
          node scripts/test-critical-flows.mjs

      - name: Commit normalized controls and generated artifacts
        run: |
          if git diff --quiet; then
            echo "Controls already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css js *.html
          git commit -m "Normalize interactive control targets"
          git push origin HEAD:review/buttons-controls-alignment
