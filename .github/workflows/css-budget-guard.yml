name: Orçamento estrutural do CSS

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**/*.css'
      - 'js/**/*.js'
      - 'scripts/build-css-bundles.mjs'
      - 'scripts/audit-css-pages.mjs'
      - 'scripts/audit-css-runtime.mjs'
      - 'scripts/check-css-budget.mjs'
      - 'config/css-audit-budget.json'
      - 'config/css-bundles.json'
      - '.github/workflows/css-budget-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar bundles determinísticos
        run: node scripts/build-css-bundles.mjs

      - name: Gerar relatórios estruturais
        run: |
          node scripts/audit-css-runtime.mjs
          node scripts/audit-css-pages.mjs

      - name: Validar orçamento do CSS
        run: node scripts/check-css-budget.mjs

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f artifacts/css-audit-report.json ]; then
            node -e "const r=require('./artifacts/css-audit-report.json'); const x=require('./artifacts/css-runtime-report.json'); const b=require('./config/css-audit-budget.json'); const i=r.metrics.inlineStyleBlocks+r.metrics.inlineStyleAttributes; const p=x.metrics.runtimeStylesheetLinks/x.metrics.configuredPages; const lines=['## Orçamento estrutural do CSS','', '- Arquivos CSS de origem: '+r.metrics.cssFiles+'/'+b.maxCssFiles, '- CSS órfãos: '+r.orphanCss.length+'/'+b.maxOrphanCss, '- Estilos inline: '+i+'/'+b.maxInlineStyles, '- !important: '+r.metrics.importantDeclarations+'/'+b.maxImportantDeclarations, '- Regras vazias: '+r.metrics.emptyRules+'/'+b.maxEmptyRules, '- Stylesheets por página: '+p+'/'+b.maxRuntimeStylesheetsPerPage, '- @import em runtime: '+x.metrics.runtimeImports+'/'+b.maxRuntimeImports, '- Fontes duplicadas: '+x.metrics.duplicateBundleSources+'/'+b.maxDuplicateBundleSources, '- CSS criado por JS: '+x.metrics.javascriptStyleBlocks+'/'+b.maxJavascriptStyleBlocks]; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');"
          fi
