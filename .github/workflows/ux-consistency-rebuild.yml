name: UX consistency rebuild

on:
  push:
    branches:
      - review/ux-consistency
    paths:
      - 'css/**/*.css'
      - 'typescript/**/*.ts'
      - 'config/css-bundles.json'
      - 'scripts/audit-ux-consistency.mjs'
      - '.github/workflows/ux-consistency-rebuild.yml'

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/ux-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile TypeScript
        run: npm run build:typescript
      - name: Rebuild CSS bundles
        run: node scripts/build-css-bundles.mjs --write
      - name: Validate final UX state
        run: |
          npm run typecheck
          node scripts/audit-ux-consistency.mjs
          node scripts/audit-control-targets.mjs
          node scripts/audit-typography-legibility.mjs
          node scripts/audit-theme-contrast.mjs
          node scripts/build-css-bundles.mjs
          node scripts/audit-css-runtime.mjs
          node scripts/audit-css-pages.mjs
          node scripts/final-css-validation.mjs
          node scripts/check-css-budget.mjs
          node scripts/check-important-debt.mjs
          node scripts/audit-page-scripts.mjs
          node scripts/audit-global-runtime.mjs
          node scripts/audit-performance-accessibility.mjs
          node scripts/test-critical-flows.mjs
      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/bundles js *.html
          git commit -m "Rebuild consolidated UX artifacts"
          git push origin HEAD:review/ux-consistency
