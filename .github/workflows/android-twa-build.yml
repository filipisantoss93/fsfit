name: Android TWA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/android-app
    paths:
      - 'android/**'
      - '.github/workflows/android-twa-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-twa-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FSFIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.FSFIT_ANDROID_KEYSTORE_BASE64 }}
      FSFIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FSFIT_ANDROID_KEYSTORE_PASSWORD }}
      FSFIT_ANDROID_KEY_PASSWORD: ${{ secrets.FSFIT_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli@1.24.1

      - name: Configure Bubblewrap
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fsfit-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check production signing secrets
        if: ${{ env.FSFIT_ANDROID_KEYSTORE_BASE64 == '' || env.FSFIT_ANDROID_KEYSTORE_PASSWORD == '' || env.FSFIT_ANDROID_KEY_PASSWORD == '' }}
        run: |
          echo 'Os secrets de assinatura Android não estão completos.'
          exit 1

      - name: Restore production signing key
        working-directory: android
        shell: bash
        run: printf '%s' "$FSFIT_ANDROID_KEYSTORE_BASE64" | base64 --decode > fsfit-upload-key.jks

      - name: Build signed production APK and AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.FSFIT_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.FSFIT_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          bubblewrap build \
            --skipPwaValidation \
            --manifest=./twa-manifest.json \
            --signingKeyPath=./fsfit-upload-key.jks \
            --signingKeyAlias=fsfit 2>&1 | tee bubblewrap-build.log

      - name: Upload Bubblewrap diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fsfit-bubblewrap-build-log
          path: android/bubblewrap-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload signed production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsfit-android-production
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30
