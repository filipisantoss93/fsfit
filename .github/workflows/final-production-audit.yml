name: Final production audit

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'js/**'
      - 'scripts/**'
      - 'docs/**'
      - 'sw.js'
      - 'manifest.json'
      - 'manifest.webmanifest'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-production-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-readiness:
    name: Validate production readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate final audit syntax
        run: node --check scripts/final-production-audit.mjs

      - name: Run final production matrix
        run: node scripts/final-production-audit.mjs
