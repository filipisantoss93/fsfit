name: Atualizar acompanhamento em abas

on:
  push:
    paths:
      - '.github/workflows/bump-live-editor-cache.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/bump_live_editor_cache.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualizar cache do acompanhamento com abas Treinos e Chat"
          git push
