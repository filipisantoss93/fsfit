name: Colors contrast review build

on:
  push:
    branches:
      - review/colors-contrast
    paths:
      - 'css/**/*.css'
      - 'scripts/audit-theme-contrast.mjs'
      - '.github/workflows/auditoria-css.yml'
      - '.github/workflows/colors-contrast-review.yml'

permissions:
  contents: write

concurrency:
  group: colors-contrast-review
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/colors-contrast
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build:typescript

      - name: Rebuild CSS bundles
        run: node scripts/build-css-bundles.mjs --write

      - name: Validate colors and runtime
        run: |
          npm run typecheck
          node scripts/audit-theme-contrast.mjs
          node scripts/build-css-bundles.mjs
          node scripts/audit-css-runtime.mjs
          node scripts/audit-css-pages.mjs
          node scripts/final-css-validation.mjs
          node scripts/audit-page-scripts.mjs
          node scripts/audit-global-runtime.mjs
          node scripts/audit-performance-accessibility.mjs
          node scripts/test-critical-flows.mjs

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/bundles *.html js
          git commit -m "Build color and contrast review bundles"
          git push origin HEAD:review/colors-contrast
