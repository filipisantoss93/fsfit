name: Ajustar acompanhamento de hoje

on:
  push:
    paths:
      - '.github/workflows/ajustar-acompanhamento-hoje.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajustes
        run: python .github/scripts/ajustar_acompanhamento_hoje.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/aulas-painel-editor.js painel.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "Ajustar treino de hoje no acompanhamento ao vivo"
          git push
