name: Preservar zoom acessível em todas as páginas FS Fit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-accessible-zoom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remover restrições de zoom das páginas HTML
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          VIEWPORT = '  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'

          viewport_meta = re.compile(
              r'(?im)^[ \t]*<meta\b(?=[^>]*\bname=["\']viewport["\'])[^>]*>[ \t]*(?:\r?\n)?'
          )
          zoom_script = re.compile(
              r'(?im)^[ \t]*<script\b(?=[^>]*\bsrc=["\'][^"\']*zoom-lock\.js[^"\']*["\'])[^>]*>\s*</script>\s*\n?'
          )
          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              if not re.search(r'(?i)<head\b', text) or not re.search(r'(?i)</head>', text):
                  continue

              matches = list(viewport_meta.finditer(text))
              if matches:
                  updated = viewport_meta.sub(VIEWPORT + '\n', text, count=1)
                  updated = viewport_meta.sub('', updated)
              else:
                  updated = re.sub(
                      r'(?i)(<head\b[^>]*>)',
                      r'\1\n' + VIEWPORT + '\n',
                      text,
                      count=1
                  )
              updated = zoom_script.sub('', updated)

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Páginas atualizadas: {len(changed)}')
          for item in changed:
              print(item)
          PY

      - name: Commitar correções de viewport quando necessário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma página precisou ser alterada.'
            exit 0
          fi
          git commit -m 'fix: preservar zoom acessível em todas as páginas'
          git pull --rebase origin main
          git push origin main
