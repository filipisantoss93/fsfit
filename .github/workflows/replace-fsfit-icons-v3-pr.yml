name: Aplicar ícones FS Fit v3 sem borda

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'assets/icons-source-v3/**'
      - '.icon-replace-v3-trigger'

permissions:
  contents: write

jobs:
  replace-icons:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Gerar e substituir todos os ícones
        shell: bash
        run: |
          set -euo pipefail
          cat assets/icons-source-v3/fsfit-source.part* | base64 --decode > /tmp/fsfit-icon-source.webp
          echo "578abdd6ff4c25d3f1bfbdd32b97f83b9b2326ed6e2b9dd18d2d35fda3601549  /tmp/fsfit-icon-source.webp" | sha256sum -c -

          python <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, shutil, re

          SRC = Path('/tmp/fsfit-icon-source.webp')
          OUT = Path('assets/icons')
          VERSION = '20260721-icons-v3'
          img = Image.open(SRC).convert('RGBA')
          cache = {}

          def resized(size):
              if size not in cache:
                  cache[size] = img.resize((size, size), Image.Resampling.LANCZOS)
              return cache[size]

          def save_rgba(size, path):
              path.parent.mkdir(parents=True, exist_ok=True)
              resized(size).save(path, 'PNG', optimize=True)

          def save_rgb(size, path, bg=(15,17,21)):
              path.parent.mkdir(parents=True, exist_ok=True)
              canvas = Image.new('RGBA', (size, size), bg + (255,))
              canvas.alpha_composite(resized(size))
              canvas.convert('RGB').save(path, 'PNG', optimize=True)

          if OUT.exists():
              shutil.rmtree(OUT)
          OUT.mkdir(parents=True, exist_ok=True)

          for s in [1024, 2048]:
              save_rgba(s, OUT / '00-master' / f'fs-fit-master-{s}.png')

          for s in [16,32,48,64,96,128,256,512]:
              save_rgba(s, OUT / '01-web-favicon' / f'favicon-{s}x{s}.png')
          resized(256).save(OUT / '01-web-favicon' / 'favicon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          save_rgb(180, OUT / '01-web-favicon' / 'apple-touch-icon.png')
          save_rgba(192, OUT / '01-web-favicon' / 'android-chrome-192x192.png')
          save_rgba(512, OUT / '01-web-favicon' / 'android-chrome-512x512.png')

          for s in [72,96,128,144,152,192,384,512]:
              save_rgba(s, OUT / '02-pwa' / f'icon-{s}x{s}.png')
          for s in [192,512]:
              save_rgb(s, OUT / '02-pwa' / f'icon-maskable-{s}x{s}.png')
          pwa_example = {
              'name':'FS Fit','short_name':'FS Fit',
              'icons': [
                  *[{'src':f'/assets/icons/02-pwa/icon-{s}x{s}.png?v={VERSION}','sizes':f'{s}x{s}','type':'image/png','purpose':'any'} for s in [72,96,128,144,152,192,384,512]],
                  {'src':f'/assets/icons/02-pwa/icon-maskable-192x192.png?v={VERSION}','sizes':'192x192','type':'image/png','purpose':'maskable'},
                  {'src':f'/assets/icons/02-pwa/icon-maskable-512x512.png?v={VERSION}','sizes':'512x512','type':'image/png','purpose':'maskable'}
              ]
          }
          (OUT / '02-pwa' / 'manifest-icons-example.json').write_text(json.dumps(pwa_example, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          for folder,s in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              save_rgb(s, OUT / '03-android' / 'res' / folder / 'ic_launcher.png')
              save_rgb(s, OUT / '03-android' / 'res' / folder / 'ic_launcher_round.png')
          for folder,s in {'mipmap-mdpi':108,'mipmap-hdpi':162,'mipmap-xhdpi':216,'mipmap-xxhdpi':324,'mipmap-xxxhdpi':432}.items():
              save_rgba(s, OUT / '03-android' / 'adaptive-foreground' / folder / 'ic_launcher_foreground.png')
          save_rgb(512, OUT / '03-android' / 'play-store-icon-512x512.png')

          ios_dir = OUT / '04-ios' / 'AppIcon.appiconset'
          specs = [
              ('AppIcon-20@1x.png',20,'20x20','1x','ipad'),('AppIcon-20@2x.png',40,'20x20','2x','iphone'),('AppIcon-20@3x.png',60,'20x20','3x','iphone'),
              ('AppIcon-29@1x.png',29,'29x29','1x','ipad'),('AppIcon-29@2x.png',58,'29x29','2x','iphone'),('AppIcon-29@3x.png',87,'29x29','3x','iphone'),
              ('AppIcon-40@1x.png',40,'40x40','1x','ipad'),('AppIcon-40@2x.png',80,'40x40','2x','iphone'),('AppIcon-40@3x.png',120,'40x40','3x','iphone'),
              ('AppIcon-60@2x.png',120,'60x60','2x','iphone'),('AppIcon-60@3x.png',180,'60x60','3x','iphone'),
              ('AppIcon-76@1x.png',76,'76x76','1x','ipad'),('AppIcon-76@2x.png',152,'76x76','2x','ipad'),('AppIcon-83.5@2x.png',167,'83.5x83.5','2x','ipad'),
              ('AppIcon-1024.png',1024,'1024x1024','1x','ios-marketing')
          ]
          contents = {'images':[], 'info':{'author':'xcode','version':1}}
          for filename,pixels,logical,scale,idiom in specs:
              save_rgb(pixels, ios_dir / filename)
              contents['images'].append({'filename':filename,'idiom':idiom,'scale':scale,'size':logical})
          (ios_dir / 'Contents.json').write_text(json.dumps(contents, indent=2)+'\n', encoding='utf-8')

          for name,s in [('mstile-70x70.png',70),('mstile-150x150.png',150),('mstile-310x310.png',310)]:
              save_rgb(s, OUT / '05-windows-tiles' / name)
          wide = Image.new('RGB',(310,150),(15,17,21))
          wide.paste(resized(120).convert('RGB'),((310-120)//2,(150-120)//2))
          wide.save(OUT / '05-windows-tiles' / 'mstile-310x150.png','PNG',optimize=True)

          for s in [36,48,72,96,128,144,180,192,256,384,512,1024]:
              save_rgba(s, OUT / '06-extra-common-sizes' / f'fs-fit-icon-{s}x{s}.png')
          (OUT / 'README.md').write_text('# FS Fit — Pacote oficial de ícones v3\n\nÍcones oficiais sem borda branca externa.\n', encoding='utf-8')

          for mp in [Path('manifest.webmanifest'), Path('manifest-personal.webmanifest')]:
              if mp.exists():
                  data=json.loads(mp.read_text(encoding='utf-8'))
                  for icon in data.get('icons',[]):
                      icon['src']=icon.get('src','').split('?')[0]+f'?v={VERSION}'
                  mp.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          icon_re=re.compile(r'(?P<p>/?assets/icons/01-web-favicon/(?:favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png))(?:\?v=[^\"\']+)?')
          manifest_re=re.compile(r'(?P<p>(?:manifest|manifest-personal)\.webmanifest)(?:\?v=[^\"\']+)?')
          for p in Path('.').rglob('*.html'):
              if any(x in {'.git','node_modules'} for x in p.parts): continue
              t=p.read_text(encoding='utf-8')
              u=icon_re.sub(lambda m:m.group('p')+f'?v={VERSION}',t)
              u=manifest_re.sub(lambda m:m.group('p')+f'?v={VERSION}',u)
              if u!=t: p.write_text(u,encoding='utf-8')

          count=sum(1 for p in OUT.rglob('*') if p.is_file())
          print('Arquivos gerados:',count)
          if count != 74: raise SystemExit(f'Esperado 74, gerado {count}')
          PY

      - name: Commitar na branch do PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons manifest.webmanifest manifest-personal.webmanifest '*.html' ':!assets/icons-source-v3/**' || true
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração adicional.'
            exit 0
          fi
          git commit -m 'fix: substituir todos os ícones FS Fit pela versão v3 sem borda'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
