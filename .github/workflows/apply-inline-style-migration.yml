name: Aplicar migração final de estilos inline

on:
  push:
    branches:
      - cleanup/zero-inline-styles-large-batch
    paths:
      - 'scripts/migrate-inline-styles.mjs'
      - '.github/workflows/apply-inline-style-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-inline-styles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: cleanup/zero-inline-styles-large-batch
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Migrar estilos inline
        run: node scripts/migrate-inline-styles.mjs

      - name: Validar auditoria estrutural
        run: |
          node scripts/audit-css-pages.mjs
          node scripts/check-css-budget.mjs

      - name: Consolidar alterações geradas
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' css/inline-cleanup.css config/css-audit-budget.json
          git commit -m 'Consolidar estilos inline restantes'
          git push origin HEAD:cleanup/zero-inline-styles-large-batch
