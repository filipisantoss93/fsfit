name: Controlar dívida de important

on:
  pull_request:
    paths:
      - 'css/**'
      - 'config/important-debt-budget.json'
      - 'scripts/check-important-debt.mjs'
      - '.github/workflows/important-debt-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  important-debt-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar dívida de important
        run: node scripts/check-important-debt.mjs

      - name: Validar consolidação estrutural
        run: |
          node scripts/audit-css-pages.mjs
          node scripts/final-css-validation.mjs
          node scripts/check-css-budget.mjs

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: important-debt-report
          path: reports/important-debt-report.json
