name: Auditoria estrutural de CSS

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**/*.css'
      - 'js/**/*.js'
      - 'config/css-bundles.json'
      - 'scripts/build-css-bundles.mjs'
      - 'scripts/audit-css-pages.mjs'
      - 'scripts/audit-css-runtime.mjs'
      - '.github/workflows/auditoria-css.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**/*.css'
      - 'js/**/*.js'
      - 'config/css-bundles.json'
      - 'scripts/build-css-bundles.mjs'
      - 'scripts/audit-css-pages.mjs'
      - 'scripts/audit-css-runtime.mjs'
      - '.github/workflows/auditoria-css.yml'

permissions:
  contents: read

jobs:
  audit-css:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar bundles determinísticos
        run: node scripts/build-css-bundles.mjs

      - name: Auditar contrato de CSS em runtime
        run: node scripts/audit-css-runtime.mjs

      - name: Auditar referências, duplicações e arquivos de origem
        run: node scripts/audit-css-pages.mjs
