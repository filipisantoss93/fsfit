name: Importar ícones FS Fit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-fsfit-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Gerar pacote completo de ícones
        shell: bash
        run: |
          set -euo pipefail
          cat assets/icons-source-v5/fsfit-source.part* | base64 --decode > /tmp/fsfit-source.jpeg
          echo "f5cb361f69d38099824e383571759b01ec5ad427cc26eb83ebab1a059bfef2ce  /tmp/fsfit-source.jpeg" | sha256sum -c -
          python scripts/generate-fsfit-icons.py /tmp/fsfit-source.jpeg assets/icons

          # Limpa fontes e arquivos temporários usados somente nesta importação.
          rm -rf assets/icons-source assets/icons-source-v2 assets/icons-source-v3 assets/icons-source-v4 assets/icons-source-v5
          rm -f scripts/generate-fsfit-icons.py

          # Limpa marcadores temporários de tentativas anteriores.
          rm -f assets/icons/UPLOAD-PLACEHOLDER.txt
          rm -f assets/icons/test-base64.txt
          rm -f assets/icons/.keep
          rm -f assets/icons/README-UPLOAD.md
          rm -f assets/icons/NOTE.txt
          rm -f assets/icons/STOP-ACCIDENT.txt
          rm -f assets/icons/TEMP.txt
          rm -f assets/icons/TEMP2.txt
          rm -f assets/icons/TEMP3.txt
          rm -f assets/icons/DO-NOT-USE.txt
          rm -f assets/icons/DO-NOT-USE-2.txt
          rm -f assets/icons/temporary-check.txt
          rm -f assets/icons/.upload-status.txt
          rm -f assets/icons/.upload-method.txt
          rm -f assets/icons/.keep-binary-upload.txt
          rm -f assets/icons/.ignore-upload.txt
          rm -f assets/icons/.tree-upload-note.txt
          rm -f assets/icons/.tmp-upload-marker.txt
          rm -f assets/icons/.final-upload-prep.txt
          rm -f assets/icons/.direct-upload-prep.txt
          rm -f assets/icons/.oops.txt
          rm -f assets/icons/.tmp2.txt
          rm -f assets/icons/.last-temp.txt
          rm -f assets/icons/.tmp3.txt
          rm -f assets/icons/.tmp4.txt
          rm -f assets/icons/.tmp5.txt
          rm -f assets/icons/.tmp6.txt
          rm -f assets/icons/.tmp7.txt
          rm -f assets/icons/.tmp8.txt
          rm -f assets/icons/.tree-test

      - name: Commitar imagens geradas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para commitar.'
            exit 0
          fi
          git commit -m 'chore: adiciona pacote completo de ícones do FS Fit'
          git pull --rebase origin main
          git push origin main
