name: FS Fit runtime style scan

on:
  push:
    branches:
      - audit/runtime-styles-scan-27

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/runtime-styles-scan-27
          fetch-depth: 0

      - name: Scan runtime styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('js')]
          patterns = {
              "create-style": re.compile(r"createElement\(\s*['\"]style['\"]\s*\)"),
              "style-text": re.compile(r"style\.textContent\s*="),
              "append-style": re.compile(r"appendChild\(\s*style\s*\)"),
              "html-style-tag": re.compile(r"<style(?:\s|>)", re.I),
              "create-link": re.compile(r"createElement\(\s*['\"]link['\"]\s*\)"),
              "inline-style-template": re.compile(r"style=['\"]"),
              "style-property": re.compile(r"\.style\.[A-Za-z_-]+\s*="),
              "style-set-property": re.compile(r"\.style\.setProperty\("),
              "object-assign-style": re.compile(r"Object\.assign\([^\n]*\.style"),
          }

          rows = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.js')):
                  text = path.read_text(encoding='utf-8', errors='replace')
                  counts = {name: len(pattern.findall(text)) for name, pattern in patterns.items()}
                  structural = counts['create-style'] + counts['style-text'] + counts['html-style-tag'] + counts['create-link']
                  if not any(counts.values()):
                      continue
                  lines = text.splitlines()
                  matches = []
                  for idx, line in enumerate(lines, 1):
                      hit = [name for name, pattern in patterns.items() if pattern.search(line)]
                      if hit:
                          matches.append(f"  L{idx}: {','.join(hit)} :: {line.strip()[:220]}")
                  rows.append((structural, sum(counts.values()), len(lines), str(path), counts, matches))

          rows.sort(key=lambda item: (-item[0], -item[1], -item[2], item[3]))
          out = [
              '# FS Fit runtime style scan',
              '',
              'Ordered by structural runtime CSS markers, then total style mutations.',
              '',
          ]
          for structural, total, line_count, path, counts, matches in rows:
              summary = ', '.join(f'{name}={value}' for name, value in counts.items() if value)
              out.append(f'## {path} | structural={structural} | total={total} | lines={line_count}')
              out.append(summary)
              out.extend(matches[:80])
              if len(matches) > 80:
                  out.append(f'  ... {len(matches) - 80} more matches')
              out.append('')

          report = Path('.audit/runtime-styles-scan.txt')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit/runtime-styles-scan.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Registrar varredura de estilos em runtime"
          git push origin HEAD:audit/runtime-styles-scan-27
