name: Relatório de limpeza CSS

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**/*.css'
      - 'scripts/audit-css-pages.mjs'
      - '.github/workflows/css-cleanup-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-audit-report:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar auditoria
        run: node scripts/audit-css-pages.mjs

      - name: Resumo da auditoria
        if: always()
        run: |
          if [ -f artifacts/css-audit-report.json ]; then
            node -e "const r=require('./artifacts/css-audit-report.json'); const m=r.metrics; const lines=['## Auditoria CSS','', '- HTML: '+m.htmlFiles, '- CSS: '+m.cssFiles, '- CSS potencialmente órfãos: '+r.orphanCss.length, '- Estilos inline: '+(m.inlineStyleBlocks+m.inlineStyleAttributes), '- !important: '+m.importantDeclarations, '- Falhas: '+r.failures.length, '- Avisos: '+r.warnings.length]; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n')+'\\n');"
          fi

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-audit-report
          path: artifacts/css-audit-report.json
          if-no-files-found: error
          retention-days: 14
