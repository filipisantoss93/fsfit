name: Theme system review build

on:
  push:
    branches:
      - review/theme-auto-light-dark
    paths:
      - 'typescript/theme-runtime.ts'
      - 'typescript/layout-core.ts'
      - 'typescript/layout.ts'
      - 'css/fsfit-design-system.css'
      - 'css/fsfit-design-system-components.css'
      - 'css/header-menu.css'
      - 'css/mobile-more-swipe.css'
      - 'scripts/build-css-bundles.mjs'
      - '.github/workflows/theme-system-review.yml'


permissions:
  contents: write

concurrency:
  group: theme-system-review
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout theme branch
        uses: actions/checkout@v4
        with:
          ref: review/theme-auto-light-dark
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build:typescript

      - name: Rebuild CSS bundles and HTML references
        run: node scripts/build-css-bundles.mjs --write

      - name: Validate theme build
        run: |
          npm run typecheck
          node scripts/build-css-bundles.mjs
          node scripts/audit-css-runtime.mjs
          node scripts/audit-css-pages.mjs
          node scripts/final-css-validation.mjs
          node scripts/audit-page-scripts.mjs
          node scripts/audit-global-runtime.mjs
          node scripts/audit-performance-accessibility.mjs

      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js css/bundles *.html
          git commit -m "Build theme runtime and CSS bundles"
          git push origin HEAD:review/theme-auto-light-dark
