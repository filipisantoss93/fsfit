name: Production CSS smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "css/**"
      - "js/pwa-install.js"
      - "sw.js"
      - "vercel.json"
      - ".github/workflows/production-css-smoke.yml"

permissions:
  contents: read

concurrency:
  group: production-css-smoke
  cancel-in-progress: true

jobs:
  verify-production-css:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Landing, Admin and Student stylesheets
        shell: bash
        run: |
          set -euo pipefail
          site="https://www.fsfit.com.br"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          pages=(
            "/"
            "/painel.html"
            "/agenda.html"
            "/alunos.html"
            "/financeiro.html"
            "/acesso-aluno.html"
            "/aluno.html"
          )

          for page in "${pages[@]}"; do
            slug="$(printf '%s' "$page" | tr '/.' '__')"
            html="$temp_dir/${slug:-home}.html"

            curl --fail --silent --show-error --location               --retry 3 --retry-all-errors               --output "$html" "$site$page"

            mapfile -t stylesheets < <(
              grep -oE 'href="[^"]+\.css[^"]*"' "$html"                 | sed -E 's/^href="([^"]+)"$/\1/'                 | sort -u
            )

            if [ "${#stylesheets[@]}" -eq 0 ]; then
              echo "::error::Nenhuma folha de estilo encontrada em $page."
              exit 1
            fi

            for stylesheet in "${stylesheets[@]}"; do
              case "$stylesheet" in
                http://*|https://*) url="$stylesheet" ;;
                /*) url="$site$stylesheet" ;;
                *) url="$site/$stylesheet" ;;
              esac

              headers="$temp_dir/headers"
              body="$temp_dir/style.css"
              curl --fail --silent --show-error --location                 --retry 3 --retry-all-errors                 --dump-header "$headers"                 --output "$body" "$url"

              content_type="$(awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { gsub("\r", ""); print $2 }' "$headers" | tail -1)"
              if [[ "$content_type" != text/css* ]]; then
                echo "::error::Tipo MIME inválido em $url: $content_type"
                exit 1
              fi

              if [ ! -s "$body" ]; then
                echo "::error::Folha de estilo vazia: $url"
                exit 1
              fi
            done
          done

          declare -A critical_styles=(
            ["/css/landing-home.css?v=20260808-css-guard1"]=".lp-header"
            ["/css/painel.css?v=20260730-painel-bundle1"]=".dashboard-tabs"
            ["/css/agenda-bundle.css?v=20260730-bundle1"]=".agenda-dashboard-summary"
            ["/css/alunos.css?v=20260727-dashboard1"]=".students-page"
            ["/css/financeiro.css?v=20260730-consolidado1"]=".finance-page"
            ["/css/acesso-aluno.css?v=20260730-runtime1"]=".student-access"
            ["/css/aluno.css?v=20260730-bundle1"]=".student-shell"
          )

          for stylesheet in "${!critical_styles[@]}"; do
            selector="${critical_styles[$stylesheet]}"
            curl --fail --silent --show-error --location "$site$stylesheet"               | grep --quiet --fixed-strings "$selector"               || { echo "::error::$stylesheet não contém o seletor crítico $selector."; exit 1; }
          done

          curl --fail --silent --show-error --location "$site/sw.js"             | grep --quiet --fixed-strings "fsfit-shell-"             || { echo "::error::Service Worker indisponível ou inválido."; exit 1; }

          echo "Landing, Admin, Aluno e folhas de estilo críticas estão saudáveis."
