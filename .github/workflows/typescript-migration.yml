name: TypeScript migration checks

on:
  pull_request:
    paths:
      - 'typescript/**/*.ts'
      - 'js/admin-search-clear.js'
      - 'js/admin-tabs.js'
      - 'js/admin-assinatura-saude.js'
      - 'js/admin-forecast.js'
      - 'js/exercicio-drag-order-structured-sync.js'
      - 'js/exercise-svg-extended.js'
      - 'js/exercise-svg-complete.js'
      - 'js/exercise-svg-icons.js'
      - 'js/exercise-svg-specific.js'
      - 'js/ficha-treinos-salvos.js'
      - 'js/painel-agenda-modal-hotfix.js'
      - 'js/portal-aluno-tabs.js'
      - 'js/selecionar-personal.js'
      - 'js/agenda-student-search.js'
      - 'js/ficha-aluno-hierarquia.js'
      - 'js/painel-home-desktop-carousel.js'
      - 'js/assinatura-experiencia.js'
      - 'js/treino-exercicio-categorias.js'
      - 'js/ficha-aluno-acoes.js'
      - 'js/landing-ads.js'
      - 'js/aluno-sessao-controles.js'
      - 'js/shared-components.js'
      - 'js/assinatura-realtime.js'
      - 'js/abrir-whatsapp-lembrete.js'
      - 'js/sidebar-profile-photo.js'
      - 'js/alunos-arquivamento.js'
      - 'js/library-dashboard-desktop.js'
      - 'js/ui-cache.js'
      - 'js/assinatura-cartao-status.js'
      - 'js/painel-agenda-modal-avatar.js'
      - 'js/painel-home-avatar.js'
      - 'js/aulas-painel-delete-layout-fix.js'
      - 'js/biblioteca-treinos-layout.js'
      - 'js/dieta-refeicao-modal.js'
      - 'js/exercise-picker-horizontal-scroll-fix.js'
      - 'js/library-row-click.js'
      - 'js/modal-focus-a11y.js'
      - 'js/treino-aluno-empty-state-guard.js'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-migration.yml'
  push:
    branches:
      - main
    paths:
      - 'typescript/**/*.ts'
      - 'js/admin-search-clear.js'
      - 'js/admin-tabs.js'
      - 'js/admin-assinatura-saude.js'
      - 'js/admin-forecast.js'
      - 'js/exercicio-drag-order-structured-sync.js'
      - 'js/exercise-svg-extended.js'
      - 'js/exercise-svg-complete.js'
      - 'js/exercise-svg-icons.js'
      - 'js/exercise-svg-specific.js'
      - 'js/ficha-treinos-salvos.js'
      - 'js/painel-agenda-modal-hotfix.js'
      - 'js/portal-aluno-tabs.js'
      - 'js/selecionar-personal.js'
      - 'js/agenda-student-search.js'
      - 'js/ficha-aluno-hierarquia.js'
      - 'js/painel-home-desktop-carousel.js'
      - 'js/assinatura-experiencia.js'
      - 'js/treino-exercicio-categorias.js'
      - 'js/ficha-aluno-acoes.js'
      - 'js/landing-ads.js'
      - 'js/aluno-sessao-controles.js'
      - 'js/shared-components.js'
      - 'js/assinatura-realtime.js'
      - 'js/abrir-whatsapp-lembrete.js'
      - 'js/sidebar-profile-photo.js'
      - 'js/alunos-arquivamento.js'
      - 'js/library-dashboard-desktop.js'
      - 'js/ui-cache.js'
      - 'js/assinatura-cartao-status.js'
      - 'js/painel-agenda-modal-avatar.js'
      - 'js/painel-home-avatar.js'
      - 'js/aulas-painel-delete-layout-fix.js'
      - 'js/biblioteca-treinos-layout.js'
      - 'js/dieta-refeicao-modal.js'
      - 'js/exercise-picker-horizontal-scroll-fix.js'
      - 'js/library-row-click.js'
      - 'js/modal-focus-a11y.js'
      - 'js/treino-aluno-empty-state-guard.js'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck and verify generated browser module
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TypeScript compiler
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build browser JavaScript
        run: npm run build:typescript

      - name: Ensure generated JavaScript is committed
        run: |
          git diff --exit-code -- \
            js/admin-search-clear.js \
            js/admin-tabs.js \
            js/admin-assinatura-saude.js \
            js/admin-forecast.js \
            js/exercicio-drag-order-structured-sync.js \
            js/exercise-svg-extended.js \
            js/exercise-svg-complete.js \
            js/exercise-svg-icons.js \
            js/exercise-svg-specific.js \
            js/ficha-treinos-salvos.js \
            js/painel-agenda-modal-hotfix.js \
            js/portal-aluno-tabs.js \
            js/selecionar-personal.js \
            js/agenda-student-search.js \
            js/ficha-aluno-hierarquia.js \
            js/painel-home-desktop-carousel.js \
            js/assinatura-experiencia.js \
            js/treino-exercicio-categorias.js \
            js/ficha-aluno-acoes.js \
            js/landing-ads.js \
            js/aluno-sessao-controles.js \
            js/shared-components.js \
            js/assinatura-realtime.js \
            js/abrir-whatsapp-lembrete.js \
            js/sidebar-profile-photo.js \
            js/alunos-arquivamento.js \
            js/library-dashboard-desktop.js \
            js/ui-cache.js \
            js/assinatura-cartao-status.js \
            js/painel-agenda-modal-avatar.js \
            js/painel-home-avatar.js \
            js/aulas-painel-delete-layout-fix.js \
            js/biblioteca-treinos-layout.js \
            js/dieta-refeicao-modal.js \
            js/exercise-picker-horizontal-scroll-fix.js \
            js/library-row-click.js \
            js/modal-focus-a11y.js \
            js/treino-aluno-empty-state-guard.js

      - name: Validate page script references
        run: node scripts/audit-page-scripts.mjs
