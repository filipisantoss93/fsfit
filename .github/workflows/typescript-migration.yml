  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: typescript-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck and verify generated browser module
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TypeScript compiler
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build browser JavaScript
        run: npm run build:typescript

      - name: Commit generated JavaScript for migration batch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- js/treino-aluno-exercicios-avulsos.js js/biblioteca-treinos.js js/treino-aluno-semanal.js js/aulas-painel-quick-actions.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/treino-aluno-exercicios-avulsos.js js/biblioteca-treinos.js js/treino-aluno-semanal.js js/aulas-painel-quick-actions.js
            git commit -m "Build student workout TypeScript outputs"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Ensure generated JavaScript is committed
        run: |
          git diff --exit-code -- \
