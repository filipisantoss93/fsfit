name: Gate final de produção

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'config/**'
      - 'manifest*.webmanifest'
      - 'sw.js'
      - 'scripts/**'
      - '.github/workflows/release-readiness.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsfit-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar páginas, scripts e imports
        run: node scripts/audit-page-scripts.mjs

      - name: Gerar relatórios consolidados do CSS
        run: |
          node scripts/audit-css-pages.mjs
          node scripts/audit-important-per-file.mjs

      - name: Validar estrutura e orçamentos do CSS
        run: |
          node scripts/final-css-validation.mjs
          node scripts/check-css-budget.mjs
          node scripts/check-important-debt.mjs

      - name: Validar referências, PWA e arquivos essenciais
        run: node scripts/release-readiness.mjs

      - name: Publicar relatório único da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsfit-production-audit
          path: |
            reports/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
