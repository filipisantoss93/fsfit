name: Gate final de produção

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'scripts/**'
      - '.github/workflows/release-readiness.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar páginas, scripts e imports
        run: node scripts/audit-page-scripts.mjs

      - name: Validar qualidade consolidada do CSS
        run: |
          node scripts/audit-css-pages.mjs
          node scripts/final-css-validation.mjs
          node scripts/check-css-budget.mjs
          node scripts/check-important-debt.mjs

      - name: Validar referências e arquivos essenciais
        run: node scripts/release-readiness.mjs

      - name: Publicar relatório final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsfit-release-readiness
          path: |
            reports/
            artifacts/
          if-no-files-found: warn
