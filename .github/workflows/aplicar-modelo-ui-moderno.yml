name: Aplicar modelo visual moderno

on:
  push:
    paths:
      - '.github/workflows/aplicar-modelo-ui-moderno.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar novo modelo visual
        run: python .github/scripts/aplicar_modelo_ui_moderno.py

      - name: Remover arquivos temporários
        run: |
          git rm .github/scripts/aplicar_modelo_ui_moderno.py
          git rm .github/workflows/aplicar-modelo-ui-moderno.yml

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css css/aulas-painel-compact.css painel.html js/painel-dashboard.js js/aulas-painel-editor.js
          git commit -m "Aplicar novo modelo visual do FS Fit"
          git push
