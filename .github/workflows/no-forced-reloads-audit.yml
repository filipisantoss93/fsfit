name: No forced reloads audit

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'js/**'
      - 'scripts/audit-no-forced-reloads.mjs'
      - '.github/workflows/no-forced-reloads-audit.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'js/**'
      - 'scripts/audit-no-forced-reloads.mjs'
      - '.github/workflows/no-forced-reloads-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Bloquear recargas forçadas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditar recargas
        run: node scripts/audit-no-forced-reloads.mjs
