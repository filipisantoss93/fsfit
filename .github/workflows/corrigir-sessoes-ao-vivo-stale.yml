name: Corrigir sessoes ao vivo desatualizadas

on:
  push:
    paths:
      - '.github/workflows/corrigir-sessoes-ao-vivo-stale.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção
        run: python .github/scripts/corrigir_sessoes_ao_vivo_stale.py

      - name: Publicar ajustes
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrigir atualização de sessões no acompanhamento ao vivo"
          git push
