<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <script src="/js/zoom-lock.js?v=20260718-zoom-lock5"></script>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0f1115">
  <title>Personal Trainer — FS Fit</title>
  <meta name="description" content="Perfil profissional e acesso do aluno no FS Fit.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/personal-publico.css?v=20260722-student-greeting1">
  <meta name="apple-mobile-web-app-title" content="FS Fit">
  <meta name="application-name" content="FS Fit">
  <link rel="icon" href="/assets/icons/01-web-favicon/favicon.ico?v=20260722-icons-v4" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/01-web-favicon/favicon-32x32.png?v=20260722-icons-v4">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/01-web-favicon/apple-touch-icon.png?v=20260722-icons-v4">
</head>
<body>
  <main class="public-profile-shell">
    <section id="public-profile" class="public-profile-card card" aria-live="polite">
      <div class="public-profile-loading">Carregando perfil...</div>
    </section>

    <section id="student-access" class="student-access-card card hidden">
      <span class="hero-badge">ÁREA DO ALUNO</span>
      <h2>Já é aluno?</h2>
      <p>Digite seu WhatsApp cadastrado para acessar seus treinos e sua área privada.</p>

      <div id="student-access-identity" class="student-access-identity hidden" aria-live="polite"></div>
      <div id="access-message" class="message"></div>

      <form id="phone-form">
        <div class="form-group">
          <label for="student-phone">Seu WhatsApp</label>
          <input id="student-phone" name="telefone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="DDD + número" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Continuar</button>
      </form>

      <form id="pin-form" class="hidden">
        <div class="form-group">
          <label for="student-pin">PIN de 4 números</label>
          <input id="student-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Abrir minha área</button>
        <button id="change-phone" class="btn btn-outline" type="button" style="width:100%;margin-top:10px">Usar outro telefone</button>
      </form>

      <form id="activation-form" class="hidden">
        <p>Este é seu primeiro acesso. Informe o código de ativação fornecido pelo seu personal e crie seu PIN.</p>
        <div class="form-group">
          <label for="activation-code">Código de ativação</label>
          <input id="activation-code" name="activation_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 números" required>
        </div>
        <div class="form-group">
          <label for="activation-pin">Crie um PIN de 4 números</label>
          <input id="activation-pin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required>
        </div>
        <div class="form-group">
          <label for="activation-pin-confirm">Confirme o PIN</label>
          <input id="activation-pin-confirm" name="pin_confirm" type="password" inputmode="numeric" autocomplete="new-password" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Ativar acesso e entrar</button>
        <button id="change-phone-activation" class="btn btn-outline" type="button" style="width:100%;margin-top:10px">Usar outro telefone</button>
      </form>
    </section>

    <section id="public-profile-details" class="public-profile-card public-profile-content card hidden"></section>

    <footer class="public-profile-footer"><strong>FS</strong> Fit</footer>
  </main>
  <script type="module" src="/js/personal-publico.js?v=20260722-student-greeting1"></script>
</body>
</html>
