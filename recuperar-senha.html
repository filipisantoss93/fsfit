<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <script src="/js/zoom-lock.js?v=20260718-zoom-lock5"></script>
<meta charset="UTF-8">
<meta name="theme-color" content="#0f1115">
  <title>Recuperar senha — FS Fit</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="apple-mobile-web-app-title" content="FS Fit">
  <meta name="application-name" content="FS Fit">
  <link rel="icon" href="/assets/icons/01-web-favicon/favicon.ico?v=20260721-icons-v3" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/01-web-favicon/favicon-32x32.png?v=20260721-icons-v3">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/01-web-favicon/apple-touch-icon.png?v=20260721-icons-v3">
</head>
<body>
  <header class="main-header"><nav class="nav-container"><a class="logo-nav" href="index.html"><strong>FS</strong><span>Fit</span></a></nav></header>
  <main class="container">
    <section class="hero" style="grid-template-columns:1fr;min-height:calc(100vh - 140px)">
      <div class="card auth-card" style="justify-self:center;width:min(470px,100%)">
        <div class="auth-logo"><strong>FS</strong><span>Fit</span></div>
        <h2>Recuperar senha</h2>
        <p>Informe o e-mail da sua conta. Você receberá um link para criar uma nova senha.</p>
        <div id="recovery-message" class="message"></div>
        <form id="recovery-form">
          <div class="form-group">
            <label for="recovery-email">E-mail</label>
            <input id="recovery-email" name="email" type="email" autocomplete="email" required>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%">Enviar link de recuperação</button>
        </form>
        <div class="auth-switch"><a href="index.html">Voltar para o login</a></div>
      </div>
    </section>
  </main>
  <script type="module" src="js/recuperar-senha.js"></script>
</body>
</html>
