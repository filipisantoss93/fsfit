<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
  <script defer src="/js/zoom-lock.js?v=20260717-zoom-lock1"></script>
  <meta charset="UTF-8">
<meta name="theme-color" content="#0f1115">
  <title>Agenda — FS Fit</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/agenda.css">
  <meta name="apple-mobile-web-app-title" content="FS Fit">
  <meta name="application-name" content="FS Fit">
  <link rel="icon" href="/assets/icons/01-web-favicon/favicon.ico?v=20260717-icons-global2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/01-web-favicon/favicon-32x32.png?v=20260717-icons-global2">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/01-web-favicon/apple-touch-icon.png?v=20260717-icons-global2">
</head>
<body>
  <div id="header-container"></div>
  <main class="container agenda-page">
    <section class="page-header agenda-header">
      <div>
        <h1>Agenda</h1>
        <p>Consulte os alunos programados para cada dia sem sobrecarregar a visualização.</p>
      </div>
      <a class="btn btn-secondary" href="alunos.html">Gerenciar alunos</a>
    </section>

    <section class="card agenda-toolbar" aria-label="Selecionar dia da agenda">
      <button id="agenda-prev-day" class="btn btn-secondary agenda-nav-btn" type="button" aria-label="Dia anterior">←</button>
      <label class="agenda-date-field" for="agenda-date">
        <span>Dia da agenda</span>
        <input id="agenda-date" type="date">
      </label>
      <button id="agenda-next-day" class="btn btn-secondary agenda-nav-btn" type="button" aria-label="Próximo dia">→</button>
      <button id="agenda-today" class="btn btn-secondary" type="button">Hoje</button>
    </section>

    <div id="agenda-message" class="message"></div>
    <section id="agenda-grid" class="agenda-grid" aria-live="polite">
      <article class="card"><p>Carregando agenda...</p></article>
    </section>
  </main>
  <script type="module" src="js/agenda.js"></script>
</body>
</html>
